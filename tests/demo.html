<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><title>demo</title>
<style>html,body{margin:0;overflow:hidden}iframe{width:1400px;height:900px;border:0}</style>
</head>
<body>
<iframe id="f" src="../index.html"></iframe>
<script>
window.addEventListener("load", () => {
  const f = document.getElementById("f");
  const wait = () => {
    let ok = false;
    try { ok = f.contentWindow.eval("typeof App!=='undefined'"); } catch (e) {}
    if (!ok) return setTimeout(wait, 200);
    setTimeout(seed, 350);
  };
  wait();
});

function seed() {
  const w = document.getElementById("f").contentWindow;
  w.addEventListener("error", e => { document.title = "ERR " + ((e.error && e.error.message) || e.message); });
  const wall = (x1, y1, x2, y2, th) => ({ type: "wall", x1, y1, x2, y2, th: th || 200, h: 2700 });
  const doc = {
    name: "Appartamento Aurora",
    bg: null,
    objects: [
      wall(0, 0, 9000, 0), wall(9000, 0, 9000, 6000),
      wall(9000, 6000, 0, 6000), wall(0, 6000, 0, 0),
      wall(5000, 0, 5000, 6000),
      { type: "door", wall: "w5", off: 2600, w: 900, kind: "single", flip: false, rev: false },
      { type: "window", wall: "w1", off: 1200, w: 1700, flip: false, hgt: 1400 },
      { type: "window", wall: "w1", off: 6600, w: 1500, flip: false, hgt: 1400 },
      { type: "window", wall: "w3", off: 3200, w: 1200, flip: false, hgt: 1400 },
      { type: "room", name: "Giorno", color: "#E7DCC9", pts: [[0, 0], [5000, 0], [5000, 6000], [0, 6000]] },
      { type: "room", name: "Notte", color: "#D8E0E8", pts: [[5000, 0], [9000, 0], [9000, 6000], [5000, 6000]] },
      { type: "furn", key: "kitchenLine", style: "kitchen", label: "Cucina lineare", w: 2400, h: 600, x: 1700, y: 400, ang: 0, color: "#D3C7B2" },
      { type: "furn", key: "fridge", style: "fridge", label: "Frigorifero", w: 700, h: 650, x: 3400, y: 430, ang: 0, color: "#D3C7B2" },
      { type: "furn", key: "table", style: "table", label: "Tavolo da pranzo", w: 1400, h: 800, x: 2400, y: 1700, ang: 0, color: "#D3C7B2" },
      { type: "furn", key: "sofa3", style: "sofa", label: "Divano 3 posti", w: 2200, h: 900, x: 2400, y: 5350, ang: 180, color: "#C9C3B5" },
      { type: "furn", key: "tv", style: "tv", label: "TV", w: 1200, h: 90, x: 2400, y: 4500, ang: 0, color: "#2B2E34" },
      { type: "furn", key: "rug", style: "rug", label: "Tappeto", w: 2000, h: 1400, x: 2400, y: 4300, ang: 0, color: "#D8C6B6" },
      { type: "furn", key: "chair", style: "chair", label: "Sedia", w: 450, h: 450, x: 1900, y: 2450, ang: 180, color: "#C9C3B5" },
      { type: "furn", key: "chair", style: "chair", label: "Sedia", w: 450, h: 450, x: 2900, y: 2450, ang: 180, color: "#C9C3B5" },
      { type: "furn", key: "bedDouble", style: "bed", label: "Letto matrimoniale", w: 1600, h: 2000, x: 7100, y: 4600, ang: 0, color: "#BFC6D4" },
      { type: "furn", key: "nightstand", style: "nightstand", label: "Comodino", w: 500, h: 420, x: 6100, y: 5400, ang: 0, color: "#BFC6D4" },
      { type: "furn", key: "wardrobe", style: "wardrobe", label: "Armadio", w: 1800, h: 600, x: 6300, y: 400, ang: 0, color: "#BFC6D4" },
      { type: "furn", key: "wc", style: "wc", label: "WC", w: 400, h: 700, x: 8600, y: 1400, ang: 90, color: "#B8D2CE" },
      { type: "furn", key: "basin", style: "basin", label: "Lavabo", w: 600, h: 450, x: 8450, y: 2400, ang: 0, color: "#B8D2CE" },
      { type: "furn", key: "shower", style: "shower", label: "Doccia", w: 900, h: 900, x: 8400, y: 3500, ang: 0, color: "#B8D2CE" },
      { type: "furn", key: "desk", style: "desk", label: "Scrivania", w: 1400, h: 700, x: 1300, y: 3300, ang: 90, color: "#D8C6B6" },
      { type: "furn", key: "plant", style: "plant", label: "Pianta", w: 450, h: 450, x: 4400, y: 5500, ang: 0, color: "#D8C6B6" },
      { type: "socket", x: 4400, y: 400 },
      { type: "socket", x: 4400, y: 4400 },
      { type: "switch", x: 4700, y: 1500 },
      { type: "light", x: 2400, y: 3000 },
      { type: "light", x: 7000, y: 3000 },
      { type: "dim", x1: -600, y1: 0, x2: -600, y2: 6000 },
      { type: "dim", x1: 0, y1: -700, x2: 9000, y2: -700 },
      { type: "text", x: 4500, y: -3450, text: "APPARTAMENTO AURORA — 54 m²", size: 340 }
    ]
  };
  w.eval("Doc.replace(" + JSON.stringify(doc) + "); App.sel=null; Render.fit();");
  if (location.hash === "#panels") {
    setTimeout(() => {
      w.eval("App.sel = Doc.list('furn')[3].id; Doc.touch();");
      w.document.querySelector('[data-tab="catalog"]').click();
    }, 700);
  }
  if (location.hash === "#3d") {
    setTimeout(() => {
      w.document.querySelector('[data-mode="3d"]').click();
    }, 700);
  }
  setTimeout(() => {
    const t = w.eval("Doc.stats().rooms + ' locali · ' + (Doc.stats().roomArea/1e6).toFixed(1) + ' m² · ' + Doc.stats().objects + ' oggetti'");
    document.title = "DEMO " + t;
  }, 500);
}
</script>
</body>
</html>
